spring:
  application:
    name: smartpark
  datasource:
    url: jdbc:h2:mem:smartpark
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console

parking:
  max-duration-minutes: 15
  auto-checkout-interval-ms: 30000

app:
  security:
    username: admin
    password: admin123
    jwt-secret: smartpark-demo-secret-change-me-0123456789
    jwt-expiration-minutes: 60